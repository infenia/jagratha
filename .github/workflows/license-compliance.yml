name: License Compliance Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reuse-compliance:
    name: REUSE License Headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check REUSE compliance
        uses: fsfe/reuse-action@v4

  gradle-license-report:
    name: Dependency License Report
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-provider: enhanced
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate license report
        continue-on-error: true
        run: |
          echo "▶ Generating dependency license reports..."
          ./gradlew generateLicenseReport
          echo "✓ License report generated"

      - name: Check for incompatible licenses
        continue-on-error: true
        run: |
          echo "▶ Checking for Apache-2.0 incompatible licenses..."

          # List of Apache 2.0 compatible licenses
          COMPATIBLE_LICENSES=(
            "Apache License 2.0"
            "Apache License, Version 2.0"
            "Apache 2.0"
            "MIT"
            "BSD"
            "ISC"
            "LGPL"
            "MPL"
            "CDDL"
            "EPL"
            "WTFPL"
          )

          # Find all license.json files and check for issues
          find . -path "*/build/reports/licenses/license-*.json" -type f | while read report; do
            if grep -qi "GPL" "$report"; then
              echo "⚠ WARNING: GPL license detected in $report"
              echo "   GPL is NOT compatible with Apache 2.0"
              echo "   Please review: $report"
            fi
          done

          echo "✓ License compatibility check complete"

      - name: Upload license reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: license-reports
          path: |
            **/build/reports/licenses/
          retention-days: 30
          if-no-files-found: warn

      - name: Comment license report (if PR)
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const comment = `## 📋 License Compliance Report

            ### Checks Performed:
            - ✓ REUSE License Headers (files must have SPDX headers)
            - ✓ Gradle Dependency License Report (check for incompatible licenses)

            ### Details:
            All dependency licenses are checked for Apache 2.0 compatibility.

            For detailed reports, see the artifacts attached to this workflow run.

            ---
            *Generated by License Compliance Bot*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  trivy-license-scan:
    name: Trivy License Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy license scanning
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-license-results.sarif'
          severity: 'MEDIUM,HIGH,CRITICAL'
          skip-dirs: 'node_modules,build,.gradle,.git'

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-license-results.sarif') != ''
        with:
          sarif_file: 'trivy-license-results.sarif'
          category: 'Trivy License Scan'

      - name: Generate Trivy license report (human-readable)
        continue-on-error: true
        run: |
          echo "▶ Generating Trivy license report..."
          trivy fs --format table --severity MEDIUM,HIGH,CRITICAL . 2>&1 | grep -i license || echo "No license issues found"
          echo "✓ Trivy license scan complete"
