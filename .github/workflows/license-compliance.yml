name: License Compliance Check

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  reuse-compliance:
    name: REUSE License Headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check REUSE compliance
        uses: fsfe/reuse-action@v4

  gradle-license-validation:
    name: Dependency License Validation (Licensee)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-provider: enhanced
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate dependency licenses (Licensee)
        run: |
          echo "▶ Validating all dependency licenses against Apache-2.0 policy..."
          ./gradlew licensee
          echo "✓ All dependencies passed license validation"

      - name: Upload Licensee reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: licensee-reports
          path: |
            **/build/reports/licensee/
          retention-days: 30
          if-no-files-found: warn

      - name: Comment license validation result (if PR)
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const comment = `## 📋 License Compliance Report

            ### Checks Performed:
            - ✓ REUSE License Headers (files must have SPDX headers)
            - ✓ Licensee Dependency Validation (Apache-2.0 compatible licenses)
            - ✓ Trivy License Scanning (filesystem and dependencies)

            ### Details:
            All dependency licenses are validated to be Apache 2.0 compatible using **Licensee**.

            Allowed license families:
            - Apache-2.0 and compatible (MIT, BSD variants, ISC)
            - Java ecosystem (EPL, CDDL, GPL with classpath exception)
            - Other permissive licenses (MPL-2.0, WTFPL)

            For detailed reports, see the artifacts attached to this workflow run.

            ---
            *Generated by License Compliance Bot*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  trivy-license-scan:
    name: Trivy License Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy license scanning
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-license-results.sarif'
          severity: 'MEDIUM,HIGH,CRITICAL'
          skip-dirs: 'node_modules,build,.gradle,.git'

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-license-results.sarif') != ''
        with:
          sarif_file: 'trivy-license-results.sarif'
          category: 'Trivy License Scan'

      - name: Generate Trivy license report (human-readable)
        continue-on-error: true
        run: |
          echo "▶ Generating Trivy license report..."
          trivy fs --format table --severity MEDIUM,HIGH,CRITICAL . 2>&1 | grep -i license || echo "No license issues found"
          echo "✓ Trivy license scan complete"
