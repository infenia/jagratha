name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
    paths:
      - 'boot/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'boot/**'
  schedule:
    - cron: '0 0 * * *' # 5:30 AM IST (00:00 UTC)

permissions:
  contents: write

jobs:
  build:
    name: Build & Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build & Check (Boot)
        run: ./gradlew :boot:check
