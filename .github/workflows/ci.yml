name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
    paths:
      - 'boot/**'
      - 'build-logic/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'boot/**'
      - 'build-logic/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
  schedule:
    - cron: '0 0 * * *' # 5:30 AM IST (00:00 UTC)

permissions:
  contents: write

jobs:
  build:
    name: Build & Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Verify Java version
        run: |
          echo "::debug::JAVA_HOME=$JAVA_HOME"
          java -version
          javac -version

      - name: Build & Check (Boot)
        run: ./gradlew :boot:check
