# Code Rabbit Configuration
# Documentation: https://docs.coderabbit.ai/

language: en-US

tone_instructions: |
  Review this Yukta monorepo (Java/Spring Boot backend, Go CLI, JTE+Alpine.js+Tailwind frontend) with these standards in mind:
  - Java/Spring Boot: Ensure Lombok annotations (@Slf4j, @RequiredArgsConstructor, @Builder, @With), Spring WebFlux reactive patterns, plugin-api compliance, Apache License 2.0 headers, JaCoCo coverage thresholds (80% new, 70% overall)
  - Frontend: Verify JTE template XSS prevention, Tailwind best practices, Alpine.js patterns, form validation, accessibility (ARIA, semantic HTML)
  - CLI (Go): Check error handling, goroutine safety, flag parsing, logging
  - General: Maintain monorepo consistency, flag security issues, optimize performance, review test coverage

reviews:
  profile: assertive

  high_level_summary: true

  # Automatically review on PR creation
  auto_review:
    enabled: true
    drafts: false

  # Enable specific linters for code quality
  tools:
    enabled: true
    semgrep: true
    trivy: true
    yamllint: true
    ruff: true
    eslint: true
    shellcheck: true

  # Include/exclude files from review
  path_filters:
    - '!build/'
    - '!dist/'
    - '!*.min.js'
    - '!*.lock'
    - '!.gradle/'
    - '!node_modules/'
    - '!pnpm-lock.yaml'
    - '!gradlew'
    - '!gradlew.bat'
    - '!ui/dist/'
    - '!cli/bin/'
    - '!cli/vendor/'

  # Path-specific review guidance
  path_instructions:
    - path: 'core/src/main/java/**'
      instructions: 'Core orchestration engine: prioritize reactive stream patterns, DAG correctness, thread safety, error handling in orchestration flows'

    - path: 'plugins/**'
      instructions: 'Plugin implementations: ensure plugin-api contract compliance, proper resource cleanup, error propagation'

    - path: 'web/src/main/**'
      instructions: 'REST API layer: validate request validation, response serialization, HTTP status codes, error responses'

    - path: 'boot/src/main/**'
      instructions: 'Spring Boot entry point: verify GraalVM native image configuration, bean definitions, startup behavior'

    - path: 'ui/src/**'
      instructions: 'Frontend (JTE+Alpine.js+Tailwind): check XSS prevention in templates, form validation, accessibility, responsive design'

    - path: 'cli/**'
      instructions: 'Go CLI: verify error handling, graceful shutdown, flag parsing, output formatting'

    - path: '**/*.gradle'
      instructions: 'Gradle build files: check dependency versions, plugin updates, build-logic compliance'
