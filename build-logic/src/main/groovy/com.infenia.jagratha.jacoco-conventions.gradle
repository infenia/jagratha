plugins {
    id 'jacoco'
}

jacoco {
    toolVersion = "0.8.12"
}

tasks.named('test') {
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

afterEvaluate {
    // Exclude JTE-generated classes from JaCoCo analysis
    def jteGeneratedDir = file("build/jte-classes/gg/jte/generated")
    if (jteGeneratedDir.exists()) {
        jacocoTestReport {
            classDirectories.setFrom(files(classDirectories.files.collect {
                fileTree(dir: it, exclude: ['gg/jte/generated/**'])
            }))
        }
        jacocoTestCoverageVerification {
            classDirectories.setFrom(files(classDirectories.files.collect {
                fileTree(dir: it, exclude: ['gg/jte/generated/**'])
            }))
        }
    }

    jacocoTestCoverageVerification {
        dependsOn jacocoTestReport
        violationRules {
            rule {
                limit {
                    minimum = project.hasProperty('jacocoMinimumCoverage') ? project.jacocoMinimumCoverage : 0.80
                }
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification
