# Build cache configuration for faster incremental builds
org.gradle.caching=true
org.gradle.configureondemand=true

# Configuration cache (experimental but safe)
org.gradle.configuration-cache=true

# Parallel execution
org.gradle.parallel=true
org.gradle.workers.max=4

# Native image caching - GraalVM native-image specific cache
org.graalvm.buildtools.native.buildtools.gradle.plugin.caching=true

# Build Scan (optional but recommended)
org.gradle.build-scan.publish=always
org.gradle.build-scan.terms-of-service-url=https://gradle.com/terms-of-service
